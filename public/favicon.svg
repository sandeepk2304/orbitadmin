<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Central sphere gradient -->
    <radialGradient id="sphereGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ring glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Star background glow -->
  <circle cx="50" cy="50" r="45" fill="#4f46e5" fill-opacity="0.05"/>

  <!-- Core Sphere -->
  <circle cx="50" cy="50" r="18" fill="url(#sphereGrad)"/>
  <circle cx="46" cy="46" r="16" fill="white" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Orbit Ring 1 (Tilted Ellipse) -->
  <ellipse cx="50" cy="50" rx="35" ry="10" stroke="url(#ringGrad)" stroke-width="4.5" transform="rotate(-30 50 50)" filter="url(#glow)"/>

  <!-- Small orbiting planet/node -->
  <circle cx="21" cy="33" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="79" cy="67" r="3.5" fill="#a855f7" filter="url(#glow)"/>
</svg>